name: Validació mercat i IIC (branca de proves)
on:
  push:
    branches:
      - auditoria-mercat-iic-2026
      - revisio-fonts-franca-2025
      - top100-estrenes-1965-2025-2026
      - integracio-v12-bilingue-top100-2026
    paths:
      - 'v1.2/**'
      - '.github/workflows/validacio-mercat-iic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validador:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar branca
        uses: actions/checkout@v4
      - name: Instal·lar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar validador d'auditoria
        run: node v1.2/auditoria/valida-dades.mjs
      - name: Validar posicions dels exemples i mitjanes per dècada
        run: node v1.2/auditoria/valida-relat-quantitatiu.mjs
      - name: Validar numeració de notes i blocs Markdown
        run: node v1.2/auditoria/valida-referencies.mjs
      - name: Comprovar sintaxi JavaScript
        run: |
          node --check v1.2/js/part-i.js
          node --check v1.2/js/part-ii.js
          node --check v1.2/js/part-iii.js
          node --check v1.2/js/mercat.js
          node --check v1.2/js/decades-resum.js

  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Recuperar branca
        uses: actions/checkout@v4
      - name: Instal·lar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instal·lar Playwright sense descarregar navegadors innecessaris
        run: npm install --prefix v1.2/auditoria --no-save --no-package-lock playwright
      - name: Seleccionar Chromium o Chrome disponible
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          if [ -z "$CHROME" ]; then
            npx --prefix v1.2/auditoria playwright install chromium
          else
            echo "PIP_CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          fi
      - name: Arrencar servidor HTTP local
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pip-http.log 2>&1 &
          echo $! > /tmp/pip-http.pid
          sleep 2
      - name: Provar Parts I i III en navegador
        run: node v1.2/auditoria/prova-navegador.mjs
      - name: Comprovar navegació i continguts de tots els capítols catalans
        run: node v1.2/auditoria/prova-cobertura.mjs
      - name: Comprovar navegació i continguts dels capítols castellans
        run: node v1.2/auditoria/prova-cobertura-es.mjs
      - name: Arxivar captures per revisió visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-auditoria-v12
          path: qa-captures/*
          if-no-files-found: warn
          retention-days: 7
